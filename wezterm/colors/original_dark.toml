# Original WezTerm palette, preserved from the inline configuration.
[metadata]
name = "original_dark"

[colors]
foreground = "#d8d8d8"
background = "#181818"
cursor_bg = "#d8d8d8"
cursor_fg = "#181818"
selection_bg = "#d8d8d8"
selection_fg = "#181818"
ansi = ["#181818", "#ab4642", "#a1b56c", "#f7ca88", "#7cafc2", "#ba8baf", "#86c1b9", "#d8d8d8"]
brights = ["#585858", "#ab4642", "#a1b56c", "#f7ca88", "#7cafc2", "#ba8baf", "#86c1b9", "#f8f8f8"]

[colors.tab_bar]
background = "#1a1a1a"

[colors.tab_bar.active_tab]
bg_color = "#1a1a1a"
fg_color = "#ffffff"
intensity = "Normal"
underline = "None"
italic = false
strikethrough = false

[colors.tab_bar.inactive_tab]
bg_color = "#1a1a1a"
fg_color = "#585858"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#1a1a1a"
fg_color = "#888888"

[colors.tab_bar.new_tab]
bg_color = "#1a1a1a"
fg_color = "#585858"

[colors.tab_bar.new_tab_hover]
bg_color = "#1a1a1a"
fg_color = "#ffffff"
